name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: { JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef }
      - name: API tests (78 checks)
        env: { JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef, MEDNOVA_INSECURE_COOKIES: "1" }
        run: |
          npx next start -p 3000 &
          npx wait-on -t 120000 http://localhost:3000/api/health || sleep 20
          npm run test:api
